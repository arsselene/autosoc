---
- name: Install git on target server
  apt:
    name: git
    state: present

- name: Create Silver SOC directory
  file:
    path: /opt/silver_soc
    state: directory
    mode: '0755'
    owner: vboxuser
    group: vboxuser

- name: Clone or update Silver SOC from GitHub
  git:
    repo: https://github.com/arsselene/silver-soc.git
    dest: /opt/silver_soc
    version: main
    force: yes
    update: yes
  become_user: vboxuser

- name: Generate .env file from vault secrets
  template:
    src: .env.j2
    dest: /opt/silver_soc/.env
    mode: '0600'
    owner: vboxuser

- name: Build and start Silver SOC stack
  become_user: vboxuser
  shell: |
    cd /opt/silver_soc
    docker compose up -d --build
  args:
    executable: /bin/bash
  async: 900
  poll: 30

- name: Wait for PostgreSQL to be healthy
  shell: docker exec silver_postgres pg_isready -U mobilis_admin -d mobilis_soc
  register: pg_ready
  retries: 20
  delay: 10
  until: pg_ready.rc == 0
  become_user: vboxuser

- name: Wait for Redis to be healthy
  shell: docker exec silver_redis redis-cli -a R3d1s@SOC2025 ping
  register: redis_ready
  retries: 10
  delay: 5
  until: "'PONG' in redis_ready.stdout"
  become_user: vboxuser

- name: Show running containers
  shell: |
    docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
  register: containers
  become_user: vboxuser

- name: Display container status
  debug:
    var: containers.stdout_lines
