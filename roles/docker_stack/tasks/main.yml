---
- name: Create Silver SOC directory
  file:
    path: /opt/silver_soc
    state: directory
    mode: '0755'
    owner: vboxuser
    group: vboxuser

- name: Copy docker-compose.yml to server
  copy:
    src: docker-compose.yml
    dest: /opt/silver_soc/docker-compose.yml
    mode: '0644'

- name: Generate .env file from vault secrets
  template:
    src: .env.j2
    dest: /opt/silver_soc/.env
    mode: '0600'
    owner: vboxuser

- name: Start Silver SOC stack
  become_user: vboxuser
  shell: |
    cd /opt/silver_soc
    docker compose up -d
  args:
    executable: /bin/bash

- name: Wait 30 seconds for services to start
  wait_for:
    timeout: 30

- name: Wait for PostgreSQL to be healthy
  shell: docker exec silver_postgres pg_isready -U mobilis_admin -d mobilis_soc
  register: pg_ready
  retries: 15
  delay: 5
  until: pg_ready.rc == 0

- name: Wait for Redis to be healthy
  shell: docker exec silver_redis redis-cli -a R3d1s@SOC2025 ping
  register: redis_ready
  retries: 10
  delay: 3
  until: "'PONG' in redis_ready.stdout"

- name: Show running containers
  shell: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
  register: containers
  become_user: vboxuser

- name: Display container status
  debug:
    var: containers.stdout_lines
